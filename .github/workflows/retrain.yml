name: retrain
on:
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  retrain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      # No cache: this repo has no Python lockfile to key one on, and the job runs by hand.
      # setup-uv publishes exact tags only, no floating major.
      - uses: astral-sh/setup-uv@v10.1.0
        with: { enable-cache: false }
      - run: pnpm install --frozen-lockfile
      # corpus.jsonl, meta.json and X.f32, kept as an asset on this repo's training-data
      # release so the corpus stays as private as the code. Refresh it after a rebuild:
      # gh release upload training-data training-data.tar.gz --clobber
      - run: mkdir -p training/data && gh release download training-data -p training-data.tar.gz -O - | tar -xz -C training/data
        env: { GH_TOKEN: '${{ github.token }}' }
      - run: node training/pull-feedback.ts > training/data/feedback.jsonl
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
      - run: uv venv -p 3.12 training/.venv && uv pip install --python training/.venv/bin/python torch numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - id: train
        run: |
          cd training && .venv/bin/python train.py --feedback data/feedback.jsonl
          ship=$(jq -r .ship ../eval/retrain-report.json)
          echo "ship=$ship" >> "$GITHUB_OUTPUT"
      - if: steps.train.outputs.ship == 'true'
        run: pnpm test && pnpm parity
      - if: steps.train.outputs.ship == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: retrain/weekly
          title: 'chore: weekly retrain on opt-in feedback'
          body-path: eval/retrain-report.json
          add-paths: |
            packages/model/weights
            packages/rules/weights.json
            eval/report.json
            eval/retrain-report.json
